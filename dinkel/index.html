<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dinkel is a plush frog and your emotional support frosch. Tap her for a small reminder to be kind to yourself.">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Dinkel — Emotional Support Frosch">
    <meta property="og:description" content="Your emotional support frosch.">
    <meta property="og:image" content="https://datafrosch.fun/img/team/dinkel-cutout.png">

    <title>Dinkel — Emotional Support Frosch</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=20260609">

    <script defer src="https://cloud.umami.is/script.js" data-website-id="4b20fe04-a75e-40ca-bcd7-aea5d282623c"></script>

    <style>
        :root {
            /* page-local greens: #4a6630 carries white text at 6.5:1 */
            --ink: #292F36;
            --mint: #F7FFF7;
            --green-strong: #4a6630;
            --green-hover: #3f5a29;
            --green-active: #355024;
            --green-soft: #6f9449;
            --text-soft: #45503d;
            /* breathing pacer: 1 = resting, >1 = expanded. Set in JS. */
            --breath: 1;
            --breath-ms: 4000ms;
            --calm: cubic-bezier(0.37, 0, 0.63, 1);
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
        }

        .page {
            width: 100%;
            max-width: 34rem;
            margin: auto;
            padding: max(1.5rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .page-title {
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 2rem;
            line-height: 1.15;
            color: var(--green-hover);
            margin: 0;
        }

        .page-sub {
            font-size: 1.0625rem;
            line-height: 1.35;
            color: var(--text-soft);
            margin: 0.35rem 0 0;
        }

        /* ---- Dinkel and the breathing pacer ----------------------------- */

        .scene {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.75rem 0;
            margin-top: 0.35rem;
        }

        /* soft circle behind Dinkel: the breathing guide */
        .pacer {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 0;
            width: min(70vw, 290px);
            aspect-ratio: 1 / 1;
            border: 2px dashed rgba(74, 102, 48, 0.45);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(111, 148, 73, 0.13) 0%, rgba(111, 148, 73, 0.05) 60%, rgba(111, 148, 73, 0) 72%);
            transform: translate(-50%, -50%) scale(var(--breath, 1));
            transition: transform var(--breath-ms) var(--calm);
            pointer-events: none;
        }

        .dinkel {
            position: relative;
            z-index: 1;
            display: block;
            width: min(62vw, 260px);
            aspect-ratio: 1 / 1;
            background: none;
            border: 0;
            border-radius: 50%;
            padding: 0;
            cursor: pointer;
            touch-action: manipulation;
            transform-origin: 50% 100%;
            animation: bob 4.2s ease-in-out infinite;
            filter: drop-shadow(0 10px 14px rgba(41, 47, 54, 0.16));
        }

        .dinkel img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .dinkel:focus-visible {
            outline: 3px solid var(--ink);
            outline-offset: 6px;
        }

        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-8px); }
        }

        .dinkel.hop {
            animation: hop 0.55s ease-out;
        }

        @keyframes hop {
            0%   { transform: translateY(0) scale(1); }
            30%  { transform: translateY(-18px) scale(1.03); }
            55%  { transform: translateY(2px) scale(0.99); }
            78%  { transform: translateY(-6px) scale(1); }
            100% { transform: translateY(0) scale(1); }
        }

        .heart {
            position: absolute;
            left: 50%;
            top: 22%;
            z-index: 2;
            font-size: 1.25rem;
            line-height: 1;
            pointer-events: none;
            animation: float-up 1.3s ease-out forwards;
        }

        @keyframes float-up {
            0%   { opacity: 0; transform: translate(-50%, 0) scale(0.7); }
            25%  { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%, -52px) scale(1.15); }
        }

        /* ---- slogan bubble ---------------------------------------------- */

        .bubble {
            position: relative;
            max-width: 100%;
            margin: 0.25rem 0 0;
            padding: 0.65rem 1.15rem;
            background: #fff;
            border: 2px solid var(--green-soft);
            border-radius: 1.1rem;
            box-shadow: 0 6px 18px rgba(41, 47, 54, 0.12);
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: clamp(1.25rem, 5.5vw, 1.5rem);
            line-height: 1.3;
            color: var(--ink);
            overflow-wrap: anywhere;
        }

        .bubble::before {
            content: "";
            position: absolute;
            top: -8px;
            left: 50%;
            width: 12px;
            height: 12px;
            margin-left: -6px;
            background: #fff;
            border-left: 2px solid var(--green-soft);
            border-top: 2px solid var(--green-soft);
            transform: rotate(45deg);
            border-radius: 2px;
        }

        .bubble.pop {
            animation: pop 0.3s ease-out;
        }

        @keyframes pop {
            0%   { transform: scale(0.9); }
            60%  { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        /* ---- breathing controls ----------------------------------------- */

        .controls {
            width: 100%;
            margin-top: 1.1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .breathe-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            min-width: min(100%, 17rem);
            max-width: 100%;
            padding: 0.75rem 1.25rem;
            background: var(--green-strong);
            border: 2px solid var(--green-strong);
            border-radius: 999px;
            color: #fff;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 1.125rem;
            line-height: 1.25;
            text-align: center;
            overflow-wrap: anywhere;
            cursor: pointer;
            touch-action: manipulation;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .breathe-btn:hover,
        .breathe-btn.is-on:hover {
            background: var(--green-hover);
            border-color: var(--green-hover);
        }

        .breathe-btn:active,
        .breathe-btn.is-on:active {
            background: var(--green-active);
            border-color: var(--green-active);
        }

        .breathe-btn:focus-visible {
            outline: 3px solid var(--ink);
            outline-offset: 3px;
        }

        /* the row keeps its space, so nothing jumps when breathing starts */
        .status {
            width: 100%;
            min-height: 2.75rem;
            margin-top: 0.55rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .breathe-ui {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.5rem 0.65rem;
        }

        .breathe-ui[hidden] {
            display: none;
        }

        .breath-phase {
            min-width: 7.5rem;
            margin: 0;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 1.125rem;
            line-height: 1.25;
            color: var(--green-hover);
            text-align: center;
        }

        .tick {
            display: inline-grid;
            place-items: center;
            min-width: 1.75rem;
            height: 1.75rem;
            padding: 0 0.3rem;
            border: 2px solid rgba(63, 90, 41, 0.45);
            border-radius: 9999px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            line-height: 1;
            color: var(--green-hover);
            font-variant-numeric: tabular-nums;
        }

        .dots {
            display: flex;
            gap: 0.35rem;
        }

        .dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(74, 102, 48, 0.3);
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .dots span.on {
            background: var(--green-strong);
            transform: scale(1.2);
        }

        .hint {
            margin: 1.1rem 0 0;
            font-size: 1rem;
            line-height: 1.4;
            color: var(--text-soft);
        }

        .page-footer {
            margin: 1.5rem 0 0;
            font-size: 1rem;
            line-height: 1.4;
            color: var(--text-soft);
        }

        .page-footer a {
            color: var(--green-hover);
            text-decoration: underline;
            text-underline-offset: 0.15em;
        }

        .page-footer a:focus-visible {
            outline: 3px solid var(--ink);
            outline-offset: 2px;
            border-radius: 2px;
        }

        /* ---- breathing session: Dinkel bobs in rhythm ------------------- */

        body.breathing .dinkel:not(.hop) {
            animation: breathe-bob var(--breath-cycle, 16s) ease-in-out infinite;
        }

        @keyframes breathe-bob {
            0%   { transform: translateY(0); }
            25%  { transform: translateY(-7px); }
            50%  { transform: translateY(-7px); }
            75%  { transform: translateY(0); }
            100% { transform: translateY(0); }
        }

        /* ---- reduced motion: text + countdown still run ----------------- */

        @media (prefers-reduced-motion: reduce) {
            .dinkel,
            .dinkel.hop,
            .heart,
            .bubble.pop {
                animation: none !important;
            }

            .heart {
                display: none;
            }

            .pacer {
                /* inert static circle: --breath still changes, scale stays 1 */
                transform: translate(-50%, -50%) scale(1) !important;
                transition: none !important;
            }

            .dots span {
                transition: none !important;
            }
        }
    </style>

</head>
<body>

    <main class="page">
        <h1 class="page-title">Dinkel 🐸</h1>
        <p class="page-sub">emotional support frosch, on duty</p>

        <div class="scene" id="scene">
            <div class="pacer" aria-hidden="true"></div>
            <button class="dinkel" id="dinkel" type="button" aria-label="Tap Dinkel for a small reminder">
                <img src="/img/team/dinkel-cutout.png" alt="Dinkel, a plush frog" width="640" height="640">
            </button>
        </div>

        <p class="bubble" id="bubble" role="status" aria-live="polite">tap Dinkel for a reminder 🐸</p>

        <div class="controls">
            <button class="breathe-btn" id="breathe-btn" type="button">breathe with Dinkel 🌬️</button>
            <div class="status">
                <div class="breathe-ui" id="breathe-ui" hidden>
                    <p class="breath-phase" id="breath-phase" role="status" aria-live="polite">breathe in</p>
                    <span class="tick" id="breath-tick" aria-hidden="true">4</span>
                    <div class="dots" id="breath-dots" aria-hidden="true">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            </div>
        </div>

        <p class="hint">she's not in a hurry. neither are you.</p>

        <p class="page-footer">
            a small side quest from <a href="/">datafrosch.fun</a>
        </p>
    </main>

    <script src="slogans.js"></script>
    <script>
    (function () {
        var IDLE_LABEL = 'breathe with Dinkel 🌬️';
        var STOP_LABEL = 'stop exercise';
        var CLOSING = "that's it. carried by a frog 🐸";

        // one box-breathing round: inhale / hold / exhale / hold
        var PHASES = [
            { label: 'breathe in',  breath: 1.12 },
            { label: 'hold',        breath: 1.12 },
            { label: 'breathe out', breath: 1 },
            { label: 'hold',        breath: 1 }
        ];

        var root = document.documentElement;
        var scene = document.getElementById('scene');
        var dinkel = document.getElementById('dinkel');
        var bubble = document.getElementById('bubble');
        var breatheBtn = document.getElementById('breathe-btn');
        var breatheUI = document.getElementById('breathe-ui');
        var phaseLabel = document.getElementById('breath-phase');
        var tickEl = document.getElementById('breath-tick');
        var dots = Array.prototype.slice.call(document.querySelectorAll('.dots span'));

        var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

        // the page always runs 4s phases over 3 rounds; tests may shrink this
        var timing = { phase: 4000, rounds: 3 };
        window.dinkelTiming = timing;

        var list = (typeof SLOGANS !== 'undefined' && SLOGANS.length) ? SLOGANS : ['ribbit 🐸'];

        /* ---- slogans ---------------------------------------------------- */

        var last = -1;

        function pickSlogan() {
            var i = Math.floor(Math.random() * list.length);
            if (list.length > 1 && i === last) {
                i = (i + 1) % list.length;
            }
            last = i;
            return list[i];
        }

        function setBubble(text) {
            bubble.textContent = text;
            bubble.classList.remove('pop');
            // force a reflow so the pop animation restarts on every change
            void bubble.offsetWidth;
            bubble.classList.add('pop');
        }

        function saySomething() {
            setBubble(pickSlogan());
        }

        /* ---- tapping Dinkel --------------------------------------------- */

        function hopAndHeart() {
            dinkel.classList.remove('hop');
            void dinkel.offsetWidth;
            dinkel.classList.add('hop');

            var heart = document.createElement('span');
            heart.className = 'heart';
            heart.textContent = '💚';
            heart.setAttribute('aria-hidden', 'true');
            scene.appendChild(heart);
            setTimeout(function () {
                if (heart.parentNode) {
                    heart.parentNode.removeChild(heart);
                }
            }, 1400);
        }

        dinkel.addEventListener('animationend', function (e) {
            if (e.animationName === 'hop') {
                dinkel.classList.remove('hop');
            }
        });

        dinkel.addEventListener('click', function () {
            saySomething();
            if (!reduceMotion.matches) {
                hopAndHeart();
            }
        });

        // if reduced motion is switched on mid-hop, drop the hop and any heart
        // so no stale animation state survives the switch
        function clearMotion() {
            dinkel.classList.remove('hop');
            var hearts = scene.querySelectorAll('.heart');
            for (var i = 0; i < hearts.length; i++) {
                hearts[i].parentNode.removeChild(hearts[i]);
            }
        }

        function onMotionPreferenceChange() {
            if (reduceMotion.matches) {
                clearMotion();
            }
        }

        if (reduceMotion.addEventListener) {
            reduceMotion.addEventListener('change', onMotionPreferenceChange);
        } else if (reduceMotion.addListener) {
            reduceMotion.addListener(onMotionPreferenceChange);
        }

        /* ---- breathe with Dinkel ---------------------------------------- */

        var session = null;

        function updateDots(round) {
            for (var i = 0; i < dots.length; i++) {
                dots[i].classList.toggle('on', i < round);
            }
        }

        function showTick(ms) {
            // cap at the phase length: the first rAF timestamp can precede the
            // click, which would otherwise flash one extra second at start
            var cap = Math.ceil(timing.phase / 1000);
            var n = Math.max(1, Math.min(Math.ceil(ms / 1000), cap));
            if (tickEl.textContent !== String(n)) {
                tickEl.textContent = String(n);
            }
        }

        // deadline-based: a late frame catches up instead of drifting
        function enterPhase(deadline) {
            phaseLabel.textContent = PHASES[session.i].label;
            root.style.setProperty('--breath', PHASES[session.i].breath);
            session.phaseEnd = deadline;
            showTick(session.phaseEnd - performance.now());
        }

        function frame(now) {
            if (!session) {
                return;
            }

            var guard = 0;
            while (now >= session.phaseEnd && guard++ < 20) {
                session.i += 1;
                if (session.i >= PHASES.length) {
                    session.i = 0;
                    session.round += 1;
                    if (session.round > timing.rounds) {
                        finishBreathing();
                        return;
                    }
                    updateDots(session.round);
                }
                enterPhase(session.phaseEnd + timing.phase);
            }

            showTick(session.phaseEnd - now);
            session.raf = requestAnimationFrame(frame);
        }

        function startBreathing() {
            if (session) {
                return;
            }

            root.style.setProperty('--breath-ms', timing.phase + 'ms');
            root.style.setProperty('--breath-cycle', (timing.phase * 4) + 'ms');
            session = { round: 1, i: 0, phaseEnd: 0, raf: 0 };

            document.body.classList.add('breathing');
            breatheUI.hidden = false;
            breatheBtn.textContent = STOP_LABEL;
            breatheBtn.classList.add('is-on');
            updateDots(1);

            enterPhase(performance.now() + timing.phase);
            session.raf = requestAnimationFrame(frame);
        }

        function stopBreathing() {
            if (!session) {
                return;
            }

            cancelAnimationFrame(session.raf);
            session = null;
            document.body.classList.remove('breathing');
            breatheUI.hidden = true;
            breatheBtn.textContent = IDLE_LABEL;
            breatheBtn.classList.remove('is-on');
            tickEl.textContent = '4';
            root.style.setProperty('--breath', 1);
        }

        function finishBreathing() {
            stopBreathing();
            setBubble(CLOSING);
        }

        breatheBtn.addEventListener('click', function () {
            if (session) {
                stopBreathing();
            } else {
                startBreathing();
            }
        });

        /* ---- start ------------------------------------------------------ */

        saySomething();
    })();
    </script>

</body>
</html>
